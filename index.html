<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mes Recettes</title>
    <link rel="apple-touch-icon" href="icone_app_cuisine2.png">
    <style>
        :root {
            --primary-color: #ecf0f1;
            --accent-color: #1abc9c;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #fcfbfa;
            --text-muted: #a0a0a0;
            --border-color: #2c2c2c;
            --nav-bg: #1a1a1a;
            --base-font-size: 16px;
        }

        body.light-mode {
            --primary-color: #2c3e50;
            --bg-color: #fcfbfa;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e0e0e0;
            --nav-bg: #ffffff;
        }

        body.theme-turquoise { --accent-color: #1abc9c; }
        body.theme-orange { --accent-color: #e67e22; }
        body.theme-vert { --accent-color: #2ecc71; }
        body.theme-mauve { --accent-color: #9b59b6; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: env(safe-area-inset-top) 16px 90px 16px;
            transition: background-color 0.3s, color 0.3s;
            font-size: var(--base-font-size);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo-img {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 8px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--accent-color);
        }

        .header-btn.btn-plus {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .header-btn svg {
            width: 22px;
            height: 22px;
            stroke: var(--accent-color);
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-container {
            display: none;
            margin-bottom: 12px;
        }

        .search-container.active {
            display: block;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
            color: var(--text-main);
            outline: none;
        }

        /* Bannière de reprise en bas de l'accueil (au-dessus de la nav) */
        #bannierePause {
            display: none;
            position: fixed;
            bottom: 75px;
            left: 12px;
            right: 12px;
            background-color: #1e1e1e;
            color: #fcfbfa;
            border: 1px solid #333333;
            border-radius: 16px;
            padding: 12px 16px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            z-index: 1500;
        }
        body.light-mode #bannierePause {
            background-color: #ffffff;
            color: #2c3e50;
            border-color: #d0d0d0;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        .top-menu {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 16px;
            scrollbar-width: none;
            align-items: center;
        }

        .top-menu::-webkit-scrollbar {
            display: none;
        }

        .menu-item {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .menu-item.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding-bottom: 20px;
        }

        .category-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .category-img {
            width: 100%;
            height: 85px;
            object-fit: cover;
        }

        .category-banner {
            background-color: var(--accent-color);
            color: white;
            padding: 6px 8px;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
        }

        .recipe-list-container {
            display: none;
            padding-bottom: 20px;
        }
        .recipe-list-container.active {
            display: block;
        }

        .back-cat-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .recipe-row-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .recipe-row-img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .recipe-row-banner {
            background-color: var(--accent-color);
            color: white;
            flex-grow: 1;
            height: 75px;
            padding: 0 14px;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .famille-select-container {
            margin-bottom: 16px;
        }

        .famille-select {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
            color: var(--text-main);
            outline: none;
        }

        .popup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .popup-modal.active {
            display: flex;
        }
        .popup-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            position: relative;
        }
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .popup-header h3 {
            font-size: 1.05rem;
            color: var(--accent-color);
        }
        
        .popup-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            line-height: 1;
        }

        .fullscreen-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-color);
            z-index: 2000;
            flex-direction: column;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
        }
        .fullscreen-modal.active {
            display: flex;
        }

        .fullscreen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .fullscreen-header h3 {
            font-size: 1.15rem;
            color: var(--text-main);
        }

        .fullscreen-body {
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 40px;
        }

        .fullscreen-footer {
            padding: 12px 0;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .recipe-detail-img-container {
            position: relative;
            width: 100%;
            height: 250px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 14px;
        }
        .recipe-detail-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .recipe-detail-top-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .recipe-detail-close-overlay,
        .recipe-detail-pause-btn {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .recipe-detail-close-overlay {
            font-size: 1.25rem;
        }
        .recipe-detail-pause-btn svg {
            width: 18px;
            height: 18px;
            stroke: white;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .recipe-detail-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            padding: 20px 14px 12px 14px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .recipe-detail-title-block {
            flex-grow: 1;
        }
        .recipe-detail-title-overlay {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .recipe-detail-sub-info {
            font-size: 0.8rem;
            color: #dcdde1;
            font-weight: 500;
        }

        .recipe-detail-infos {
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            gap: 10px;
        }
        
        .recipe-detail-infos-top {
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            position: relative;
        }
        .recipe-detail-infos-top div {
            text-align: center;
            flex: 1;
            position: relative;
        }
        .recipe-detail-infos-top div:not(:last-child):after {
            content: '';
            position: absolute;
            right: 0;
            top: 10%;
            height: 80%;
            width: 1px;
            background-color: var(--border-color);
        }
        .recipe-detail-infos-top span {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 2px;
        }
        
        .freeze-clickable {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .freeze-clickable svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 2px;
        }
        .freeze-clickable.active svg {
            stroke: var(--accent-color);
        }
        .freeze-clickable span {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 2px;
        }
        .freeze-clickable.active span {
            color: var(--accent-color);
        }

        .portions-control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .portions-stepper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stepper-btn {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reset-portions-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            padding: 0;
        }
        .reset-portions-btn svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .calculator-trigger-btn {
            background: none;
            border: 1px dashed var(--accent-color);
            color: var(--accent-color);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .recipe-detail-section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-color);
            margin: 16px 0 8px 0;
        }
        .recipe-detail-ingredients {
            list-style: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
        }
        .recipe-detail-ingredients li {
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            cursor: pointer;
            transition: color 0.2s, text-decoration 0.2s, opacity 0.2s;
        }
        .recipe-detail-ingredients li.checked {
            text-decoration: line-through;
            color: var(--text-muted);
            opacity: 0.6;
        }
        .recipe-detail-ingredients li:last-child {
            border-bottom: none;
        }
        .recipe-detail-steps {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .recipe-detail-step-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
        }
        .recipe-detail-step-card.checked {
            opacity: 0.5;
            background-color: rgba(160, 160, 160, 0.05);
        }
        .recipe-detail-step-card.checked .recipe-detail-step-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }
        .recipe-detail-step-num {
            background-color: var(--accent-color);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .recipe-detail-step-text {
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .recipe-bottom-nav {
