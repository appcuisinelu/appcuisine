<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Application de Recettes</title>
    <style>
        .recipe-container {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 650px;
            margin: 20px auto;
            padding: 20px;
            background: #fdfdfd;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Barre des outils (Calculette + Reset) */
        .tools-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .calculette-container {
            background: #f1f5f9;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 500;
        }

        /* Bouton Réinitialiser placé après la calculette */
        .btn-reset {
            padding: 10px 18px;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background-color: #dc2626;
        }

        /* Barre des temps (Préparation, Cuisson, Congélation) */
        .time-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .time-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .time-item img {
            width: 28px;
            height: 28px;
            margin-bottom: 6px;
        }

        /* Typographie commune et homogène pour tous les libellés */
        .time-label {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 2px;
        }

        .time-value {
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="recipe-container">
    
    <!-- Section des outils : Calculette suivie immédiatement du bouton Réinitialiser -->
    <div class="tools-bar">
        <div class="calculette-container">
            <span>🧮 Calculette des portions</span>
        </div>
        
        <button class="btn-reset">Réinitialiser</button>
    </div>

    <!-- Barre des temps de la recette -->
    <div class="time-bar">
        <!-- 1. Temps de préparation -->
        <div class="time-item">
            <img src="prep-icon.svg" alt="Icône Préparation" />
            <span class="time-label">Préparation</span>
            <span class="time-value">15 min</span>
        </div>

        <!-- 2. Temps de cuisson -->
        <div class="time-item">
            <img src="cooking-icon.svg" alt="Icône Cuisson" />
            <span class="time-label">Cuisson</span>
            <span class="time-value">30 min</span>
        </div>

        <!-- 3. Congélation placée à la fin avec le nouveau pictogramme et la classe .time-label -->
        <div class="time-item">
            <img src="nouveau-flocon-icon.svg" alt="Icône Congélation" />
            <span class="time-label">Congélation</span>
            <span class="time-value">Possible</span>
        </div>
    </div>

</div>

</body>
</html>
