<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mes Recettes</title>
    <!-- Icône personnalisée pour l'écran d'accueil iPhone -->
    <link rel="apple-touch-icon" href="icone_app_cuisine2.png">
    <style>
        /* MODE SOMBRE PAR DÉFAUT (Accent turquoise par défaut) */
        :root {
            --primary-color: #ecf0f1;
            --accent-color: #1abc9c;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #fcfbfa;
            --text-muted: #a0a0a0;
            --border-color: #2c2c2c;
            --nav-bg: #1a1a1a;
        }

        /* Variables pour le mode clair */
        body.light-mode {
            --primary-color: #2c3e50;
            --bg-color: #fcfbfa;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e0e0e0;
            --nav-bg: #ffffff;
        }

        /* Thèmes de couleurs d'accents */
        body.theme-turquoise { --accent-color: #1abc9c; }
        body.theme-orange { --accent-color: #e67e22; }
        body.theme-vert { --accent-color: #2ecc71; }
        body.theme-mauve { --accent-color: #9b59b6; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: env(safe-area-inset-top) 16px 80px 16px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* En-tête supérieur */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 12px 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo-img {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 8px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: -0.5px;
            transition: color 0.3s;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Boutons + et loupe de même taille agrandie */
        .header-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--accent-color);
            transition: all 0.2s;
        }

        /* Style spécifique pour le signe + */
        .header-btn.btn-plus {
            font-size: 26px;
            font-weight: 700;
        }

        /* Style spécifique pour l'icône loupe à l'intérieur du bouton */
        .header-btn svg {
            width: 22px;
            height: 22px;
            stroke: var(--accent-color);
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header-btn:active {
            transform: scale(0.92);
        }

        /* Barre de recherche cachée par défaut */
        .search-container {
            display: none;
            margin-bottom: 12px;
        }

        .search-container.active {
            display: block;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        /* Menu principal supérieur (Onglets) */
        .top-menu {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 16px;
            scrollbar-width: none;
            align-items: center;
        }

        .top-menu::-webkit-scrollbar {
            display: none;
        }

        .menu-item {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-item.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* Vues (Onglets) */
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }

        /* Grille des catégories forcée à exactement 3 images par largeur */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding-bottom: 20px;
        }

        .category-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .category-card:active {
            transform: scale(0.97);
        }

        .category-img {
            width: 100%;
            height: 85px;
            object-fit: cover;
        }

        .category-banner {
            background-color: var(--accent-color);
            color: white;
            padding: 6px 8px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            transition: background-color 0.3s;
        }

        /* Vue liste des recettes dans une catégorie */
        .recipe-list-container {
            display: none;
            padding-bottom: 20px;
        }
        .recipe-list-container.active {
            display: block;
        }

        .back-cat-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .recipe-row-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .recipe-row-card:active {
            transform: scale(0.98);
        }

        .recipe-row-img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .recipe-row-banner {
            background-color: var(--accent-color);
            color: white;
            flex-grow: 1;
            height: 75px;
            padding: 0 14px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            transition: background-color 0.3s;
        }

        /* Style spécifique pour la sélection de profil dans l'onglet */
        .famille-select-container {
            margin-bottom: 16px;
        }

        .famille-select {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
            cursor: pointer;
        }

        .famille-select:focus {
            border-color: var(--accent-color);
        }

        /* Barre de navigation inférieure fixe avec icônes monochromes */
        .bottom-nav {
            position: fixed;
            bottom: 8px;
            left: 12px;
            right: 12px;
            background-color: var(--nav-bg);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            z-index: 1000;
            transition: background-color 0.3s;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 10px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            flex: 1;
            position: relative;
            transition: color 0.3s;
        }

        .nav-item:not(:last-child):after {
            content: '';
            position: absolute;
            right: 0;
            top: 20%;
            height: 60%;
            width: 1px;
            background-color: var(--border-color);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            stroke: var(--accent-color);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s;
        }

        /* Modale de choix des couleurs */
        .color-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .color-modal.active {
            display: flex;
        }
        .color-modal-content {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            width: 80%;
            max-width: 300px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .color-modal-content h3 {
            margin-bottom: 16px;
            font-size: 18px;
            color: var(--text-main);
        }
        .color-options {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .color-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .close-modal-btn {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body class="theme-turquoise">

    <!-- En-tête -->
    <header>
        <div class="header-brand">
            <img src="icone_app_cuisine2.png" alt="Logo" class="header-logo-img">
            <h1>Mes recettes</h1>
        </div>
        <div class="header-actions">
            <!-- Bouton + et Loupe harmonisés à la même taille -->
            <button class="header-btn btn-plus" onclick="ouvrirAjout()" title="Ajouter">+</button>
            <button class="header-btn" onclick="toggleRecherche()" title="Rechercher">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </div>
    </header>

    <!-- Barre de recherche -->
    <div class="search-container" id="searchContainer">
        <input type="text" class="search-input" placeholder="Rechercher une recette..." id="searchInput">
    </div>

    <!-- Menu principal supérieur : Incontournables + Profil dynamique -->
    <div class="top-menu" id="topMenuContainer">
        <button class="menu-item active" onclick="changerOnglet('incontournables', this)">Incontournables</button>
        <button class="menu-item" id="profilTabBtn" onclick="changerOnglet('famille', this)">Profil : Lucie</button>
    </div>

    <!-- CONTENEUR DES VUES -->
    
    <!-- 1. Vue Incontournables -->
    <div id="view-incontournables" class="view-section active">
        <div class="categories-grid" id="categoriesGrid-incontournables"></div>
        <div class="recipe-list-container" id="recipeList-incontournables"></div>
    </div>

    <!-- 2. Vue Profil (Famille) -->
    <div id="view-famille" class="view-section">
        <div class="famille-select-container">
            <select class="famille-select" id="familleSelect" onchange="changerFamilleSelection(this.value)">
                <option value="Lucie">Lucie</option>
                <option value="Clémence">Clémence</option>
                <option value="Adeline">Adeline</option>
                <option value="Gwenaëlle">Gwenaëlle</option>
                <option value="Maman">Maman</option>
                <option value="Malo">Malo</option>
                <option value="Invité">Invité</option>
            </select>
        </div>
        <div id="recipeList-famille" class="recipe-list-container active" style="display: block;"></div>
    </div>

    <!-- Fenêtre modale pour choisir la couleur -->
    <div class="color-modal" id="colorModal">
        <div class="color-modal-content">
            <h3>Choisir une couleur</h3>
            <div class="color-options">
                <button class="color-circle" style="background-color: #1abc9c;" onclick="changerCouleur('turquoise')"></button>
                <button class="color-circle" style="background-color: #e67e22;" onclick="changerCouleur('orange')"></button>
                <button class="color-circle" style="background-color: #2ecc71;" onclick="changerCouleur('vert')"></button>
                <button class="color-circle" style="background-color: #9b59b6;" onclick="changerCouleur('mauve')"></button>
            </div>
            <button class="close-modal-btn" onclick="fermerModalCouleurs()">Fermer</button>
        </div>
    </div>

    <!-- Barre de navigation en bas avec icônes monochromes -->
    <nav class="bottom-nav">
        <!-- Accueil -->
        <button class="nav-item" onclick="retourAccueil()">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Accueil</span>
        </button>
        <!-- Mode Sombre/Clair -->
        <button class="nav-item" id="themeToggleBtn" onclick="toggleTheme()">
            <svg id="themeIconSvg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <span>Mode</span>
        </button>
        <!-- Couleurs -->
        <button class="nav-item" onclick="ouvrirModalCouleurs()">
            <svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5"></circle><circle cx="17.5" cy="10.5" r=".5"></circle><circle cx="8.5" cy="7.5" r=".5"></circle><circle cx="6.5" cy="12.5" r=".5"></circle><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.504 5.555-5.55C21.996 6.45 17.5 2 12 2z"></path></svg>
            <span>Couleurs</span>
        </button>
        <!-- Exporter -->
        <button class="nav-item" onclick="exporterRecettes()">
            <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
            <span>Exporter</span>
        </button>
    </nav>

    <script>
        // Base de données structurée
        const database = {
            incontournables: {
                apero: [
                    { nom: "Cake salé aux olives", img: "https://images.unsplash.com/photo-1541529086526-db283c563270" },
                    { nom: "Mini feuilletés fromage", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1" }
                ],
                plats: [
                    { nom: "Gratin dauphinois", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1" },
                    { nom: "Poulet rôti du dimanche", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c" }
                ],
                desserts: [
                    { nom: "Tarte aux pommes", img: "https://images.unsplash.com/photo-1551024709-8f23befc6f87" },
                    { nom: "Mousse au chocolat", img: "https://images.unsplash.com/photo-1541529086526-db283c563270" }
                ],
                boulangerie: [
                    { nom: "Pain maison croustillant", img: "https://images.unsplash.com/photo-1509440159596-0249088772ff" }
                ],
                basiques: [
                    { nom: "Pâte à crêpes", img: "https://images.unsplash.com/photo-1498837167922-ddd27525d352" },
                    { nom: "Mayonnaise maison", img: "https://images.unsplash.com/photo-1556910103-1c02745aae4d" }
                ],
                maison: [
                    { nom: "Lessive liquide écolo", img: "https://images.unsplash.com/photo-1585421514284-efb74c2b69ba" }
                ],
                cosmetiques: [
                    { nom: "Baume à lèvres protecteur", img: "https://images.unsplash.com/photo-1556228720-195a672e8a03" }
                ]
            },
            famille: {
                Lucie: [
                    { nom: "Cookies moelleux", img: "https://images.unsplash.com/photo-1541529086526-db283c563270" }
                ],
                Clémence: [
                    { nom: "Tarte aux fruits", img: "https://images.unsplash.com/photo-1551024709-8f23befc6f87" },
                    { nom: "Gratin spécial", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1" }
                ],
                Adeline: [
                    { nom: "Verrines d'Adeline", img: "https://images.unsplash.com/photo-1498837167922-ddd27525d352" }
                ],
                Gwenaëlle: [
                    { nom: "Crêpes bretonnes", img: "https://images.unsplash.com/photo-1556910103-1c02745aae4d" }
                ],
                Maman: [
                    { nom: "Pot-au-feu traditionnel", img: "https://images.unsplash.com/photo-1547592180-85f173990554" }
                ],
                Malo: [
                    { nom: "Gâteau au yaourt", img: "https://images.unsplash.com/photo-1578985545062-69928b1d9587" }
                ],
                Invité: [
                    { nom: "Amuse-bouches festifs", img: "https://images.unsplash.com/photo-1541529086526-db283c563270" }
                ]
            }
        };

        const categoryMeta = {
            apero: { nom: "Apéro", img: "https://images.unsplash.com/photo-1541529086526-db283c563270" },
            plats: { nom: "Plats", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1" },
            desserts: { nom: "Desserts", img: "https://images.unsplash.com/photo-1551024709-8f23befc6f87" },
            boulangerie: { nom: "Boulangerie", img: "https://images.unsplash.com/photo-1509440159596-0249088772ff" },
            basiques: { nom: "Basiques", img: "https://images.unsplash.com/photo-1498837167922-ddd27525d352" },
            maison: { nom: "Maison", img: "https://images.unsplash.com/photo-1585421514284-efb74c2b69ba" },
            cosmetiques: { nom: "Cosmétiques", img: "https://images.unsplash.com/photo-1556228720-195a672e8a03" }
        };

        let currentTab = 'incontournables';

        function renderCategories(onglet) {
            if (onglet === 'famille') {
                const profilEnregistre = localStorage.getItem('profilFamillePreere') || 'Lucie';
                document.getElementById('familleSelect').value = profilEnregistre;
                MettreAJourTexteBoutonProfil(profilEnregistre);
                filtrerFamille(profilEnregistre);
                return;
            }

            const container = document.getElementById(`categoriesGrid-${onglet}`);
            if (!container) return;
            container.innerHTML = '';
            container.style.display = 'grid';
            
            const listContainer = document.getElementById(`recipeList-${onglet}`);
            if (listContainer) listContainer.classList.remove('active');

            for (const [catKey, meta] of Object.entries(categoryMeta)) {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.onclick = () => ouvrirCategorie(onglet, catKey);
                card.innerHTML = `
                    <img src="${meta.img}" alt="${meta.nom}" class="category-img">
                    <div class="category-banner">
                        <span>${meta.nom}</span>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function ouvrirCategorie(onglet, catKey) {
            document.getElementById(`categoriesGrid-${onglet}`).style.display = 'none';
            const listContainer = document.getElementById(`recipeList-${onglet}`);
            listContainer.classList.add('active');
            listContainer.innerHTML = '';

            const backBtn = document.createElement('button');
            backBtn.className = 'back-cat-btn';
            backBtn.innerHTML = '← Retour aux catégories';
            backBtn.onclick = () => fermerCategorie(onglet);
            listContainer.appendChild(backBtn);

            const recipes = (database[onglet] && database[onglet][catKey]) || [];

            if (recipes.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.textAlign = 'center';
                emptyMsg.style.color = 'var(--text-muted)';
                emptyMsg.style.padding = '30px';
                emptyMsg.textContent = 'Aucune recette dans cette catégorie.';
                listContainer.appendChild(emptyMsg);
            } else {
                recipes.forEach(recipe => {
                    const row = document.createElement('div');
                    row.className = 'recipe-row-card';
                    row.onclick = () => alert("Affichage de : " + recipe.nom);
                    row.innerHTML = `
                        <img src="${recipe.img}" alt="${recipe.nom}" class="recipe-row-img">
                        <div class="recipe-row-banner">
                            <span>${recipe.nom}</span>
                        </div>
                    `;
                    listContainer.appendChild(row);
                });
            }
        }

        function fermerCategorie(onglet) {
            const listContainer = document.getElementById(`recipeList-${onglet}`);
            if (listContainer) listContainer.classList.remove('active');
            const grid = document.getElementById(`categoriesGrid-${onglet}`);
            if (grid) grid.style.display = 'grid';
        }

        function MettreAJourTexteBoutonProfil(personne) {
            const profilBtn = document.getElementById('profilTabBtn');
            if (profilBtn) {
                profilBtn.textContent = `Profil : ${personne}`;
            }
        }

        function changerFamilleSelection(personne) {
            localStorage.setItem('profilFamillePreere', personne);
            MettreAJourTexteBoutonProfil(personne);
            filtrerFamille(personne);
        }

        function filtrerFamille(personne) {
            const listContainer = document.getElementById('recipeList-famille');
            listContainer.innerHTML = '';

            const recipes = (database.famille && database.famille[personne]) || [];

            if (recipes.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.textAlign = 'center';
                emptyMsg.style.color = 'var(--text-muted)';
                emptyMsg.style.padding = '30px';
                emptyMsg.textContent = 'Aucune recette pour ce profil.';
                listContainer.appendChild(emptyMsg);
            } else {
                recipes.forEach(recipe => {
                    const row = document.createElement('div');
                    row.className = 'recipe-row-card';
                    row.onclick = () => alert("Affichage de : " + recipe.nom);
                    row.innerHTML = `
                        <img src="${recipe.img}" alt="${recipe.nom}" class="recipe-row-img">
                        <div class="recipe-row-banner">
                            <span>${recipe.nom}</span>
                        </div>
                    `;
                    listContainer.appendChild(row);
                });
            }
        }

        function changerOnglet(nomOnglet, elementBtn) {
            currentTab = nomOnglet;
            document.querySelectorAll('.view-section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById('view-' + nomOnglet).classList.add('active');

            document.querySelectorAll('.top-menu .menu-item').forEach(btn => {
                btn.classList.remove('active');
            });
            if(elementBtn) elementBtn.classList.add('active');

            if (nomOnglet !== 'famille') {
                fermerCategorie(nomOnglet);
            }
            renderCategories(nomOnglet);
        }

        function retourAccueil() {
            const firstMenuBtn = document.querySelector('.top-menu .menu-item');
            changerOnglet('incontournables', firstMenuBtn);
        }

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('light-mode');
            const isLight = body.classList.contains('light-mode');
            
            const iconSvg = document.getElementById('themeIconSvg');
            if (isLight) {
                iconSvg.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
            } else {
                iconSvg.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
            }
        }

        function ouvrirModalCouleurs() {
            document.getElementById('colorModal').classList.add('active');
        }

        function fermerModalCouleurs() {
            document.getElementById('colorModal').classList.remove('active');
        }

        function changerCouleur(couleur) {
            const body = document.body;
            body.classList.remove('theme-turquoise', 'theme-orange', 'theme-vert', 'theme-mauve');
            body.classList.add('theme-' + couleur);
            fermerModalCouleurs();
        }

        function toggleRecherche() {
            const searchContainer = document.getElementById('searchContainer');
            searchContainer.classList.toggle('active');
            if (searchContainer.classList.contains('active')) {
                document.getElementById('searchInput').focus();
            }
        }

        function ouvrirAjout() {
            alert("Ouverture de l'écran d'ajout de recette !");
        }

        function exporterRecettes() {
            alert("Fonction d'exportation des recettes déclenchée !");
        }

        // Initialisation avec récupération du profil enregistré
        window.addEventListener('DOMContentLoaded', () => {
            const profilEnregistre = localStorage.getItem('profilFamillePreere') || 'Lucie';
            const selectElement = document.getElementById('familleSelect');
            if (selectElement) selectElement.value = profilEnregistre;
            MettreAJourTexteBoutonProfil(profilEnregistre);
            renderCategories('incontournables');
        });
    </script>

</body>
</html>
