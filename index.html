<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mes Recettes</title>
    <link rel="apple-touch-icon" href="icone_app_cuisine2.png">
    <style>
        :root {
            --primary-color: #ecf0f1;
            --accent-color: #1abc9c;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #fcfbfa;
            --text-muted: #a0a0a0;
            --border-color: #2c2c2c;
            --nav-bg: #1a1a1a;
        }

        body.light-mode {
            --primary-color: #2c3e50;
            --bg-color: #fcfbfa;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e0e0e0;
            --nav-bg: #ffffff;
        }

        body.theme-turquoise { --accent-color: #1abc9c; }
        body.theme-orange { --accent-color: #e67e22; }
        body.theme-vert { --accent-color: #2ecc71; }
        body.theme-mauve { --accent-color: #9b59b6; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: env(safe-area-inset-top) 16px 80px 16px;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo-img {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 8px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--accent-color);
        }

        .header-btn.btn-plus {
            font-size: 26px;
            font-weight: 700;
        }

        .header-btn svg {
            width: 22px;
            height: 22px;
            stroke: var(--accent-color);
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-container {
            display: none;
            margin-bottom: 12px;
        }

        .search-container.active {
            display: block;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
            color: var(--text-main);
            outline: none;
        }

        .top-menu {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 16px;
            scrollbar-width: none;
            align-items: center;
        }

        .top-menu::-webkit-scrollbar {
            display: none;
        }

        .menu-item {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .menu-item.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding-bottom: 20px;
        }

        .category-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .category-img {
            width: 100%;
            height: 85px;
            object-fit: cover;
        }

        .category-banner {
            background-color: var(--accent-color);
            color: white;
            padding: 6px 8px;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
        }

        .recipe-list-container {
            display: none;
            padding-bottom: 20px;
        }
        .recipe-list-container.active {
            display: block;
        }

        .back-cat-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .recipe-row-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .recipe-row-img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .recipe-row-banner {
            background-color: var(--accent-color);
            color: white;
            flex-grow: 1;
            height: 75px;
            padding: 0 14px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .famille-select-container {
            margin-bottom: 16px;
        }

        .famille-select {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--card-bg);
            color: var(--text-main);
            outline: none;
        }

        /* POPUP POUR LE CHOIX INITIAL DU + */
        .popup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .popup-modal.active {
            display: flex;
        }
        .popup-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .popup-header h3 {
            font-size: 16px;
            color: var(--text-main);
        }

        /* MODALE PLEIN ÉCRAN POUR IPHONE */
        .fullscreen-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-color);
            z-index: 2000;
            flex-direction: column;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
        }
        .fullscreen-modal.active {
            display: flex;
        }

        .fullscreen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .fullscreen-header h3 {
            font-size: 18px;
            color: var(--text-main);
        }

        .close-fullscreen-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .fullscreen-body {
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .fullscreen-footer {
            padding: 12px 0;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        /* Formulaire interne des volets */
        .form-tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }
        .form-tabs::-webkit-scrollbar { display: none; }

        .form-tab-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .form-tab-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .form-volet { display: none; }
        .form-volet.active { display: block; }

        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-muted);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 11px 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--card-bg);
            color: var(--text-main);
            outline: none;
        }

        .form-row {
            display: flex;
            gap: 8px;
        }
        .form-row .form-group { flex: 1; }

        .ingredient-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }
        .ingredient-row input, .ingredient-row select {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 9px;
            font-size: 13px;
        }
        .ing-qty { width: 65px !important; text-align: center; }
        .ing-unit { width: 95px !important; }
        .ing-name { flex-grow: 1; }

        .etape-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: flex-start;
        }
        .etape-num {
            background-color: var(--accent-color);
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 6px;
        }
        .etape-row textarea {
            flex-grow: 1;
            resize: vertical;
            min-height: 55px;
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 9px;
            outline: none;
        }

        .secondary-btn {
            background-color: var(--card-bg);
            color: var(--accent-color);
            border: 1px dashed var(--accent-color);
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
            text-align: center;
        }

        .photo-preview {
            width: 100%;
            height: 180px;
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 8px;
            object-fit: cover;
            background-color: var(--card-bg);
            overflow: hidden;
        }

        .primary-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            flex: 1;
            text-align: center;
        }

        .add-option-btn {
            width: 100%;
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .add-option-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--accent-color);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .color-options {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        .color-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .bottom-nav {
            position: fixed;
            bottom: 8px;
            left: 12px;
            right: 12px;
            background-color: var(--nav-bg);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 10px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            flex: 1;
            position: relative;
        }

        .nav-item:not(:last-child):after {
            content: '';
            position: absolute;
            right: 0;
            top: 20%;
            height: 60%;
            width: 1px;
            background-color: var(--border-color);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            stroke: var(--accent-color);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
        <link rel="apple-touch-icon" href="icone_app_cuisine2.png">
</head>
<body class="theme-turquoise">

    <header>
        <div class="header-brand">
            <img src="icone_app_cuisine2.png" alt="Logo" class="header-logo-img" onerror="this.style.display='none'">
            <h1>Mes recettes</h1>
        </div>
        <div class="header-actions">
            <button class="header-btn btn-plus" onclick="ouvrirMenuAjout()" title="Ajouter">+</button>
            <button class="header-btn" onclick="toggleRecherche()" title="Rechercher">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </div>
    </header>

    <div class="search-container" id="searchContainer">
        <input type="text" class="search-input" placeholder="Rechercher une recette..." id="searchInput">
    </div>

    <div class="top-menu" id="topMenuContainer">
        <button class="menu-item active" onclick="changerOnglet('incontournables', this)">Incontournables</button>
        <button class="menu-item" id="profilTabBtn" onclick="changerOnglet('famille', this)">Profil : Lucie</button>
    </div>

    <div id="view-incontournables" class="view-section active">
        <div class="categories-grid" id="categoriesGrid-incontournables"></div>
        <div class="recipe-list-container" id="recipeList-incontournables"></div>
    </div>

    <div id="view-famille" class="view-section">
        <div class="famille-select-container">
            <select class="famille-select" id="familleSelect" onchange="changerFamilleSelection(this.value)">
                <option value="Lucie">Lucie</option>
                <option value="Clémence">Clémence</option>
                <option value="Adeline">Adeline</option>
                <option value="Gwenaëlle">Gwenaëlle</option>
                <option value="Maman">Maman</option>
                <option value="Malo">Malo</option>
                <option value="Invité">Invité</option>
            </select>
        </div>
        <div id="recipeList-famille" class="recipe-list-container active" style="display: block;"></div>
    </div>

    <!-- 1. POPUP DE SÉLECTION INITIALE (EN CLIQUANT SUR +) -->
    <div class="popup-modal" id="addChoiceModal">
        <div class="popup-content">
            <div class="popup-header">
                <h3>Ajouter une recette</h3>
                <button class="close-fullscreen-btn" style="width:30px; height:30px; font-size:16px;" onclick="fermerMenuAjout()">&times;</button>
            </div>
            
            <button class="add-option-btn" onclick="choixAjout('manuel')">
                <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                Ajouter une nouvelle recette
            </button>
            
            <button class="add-option-btn" onclick="choixAjout('site')">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                Importer une recette d'un site
            </button>
            
            <button class="add-option-btn" onclick="choixAjout('scanPhoto')">
                <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                Importer une recette à partir d'une photo
            </button>

            <button class="add-option-btn" onclick="choixAjout('camera')">
                <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                Prendre une photo (Appareil photo)
            </button>

            <button class="add-option-btn" onclick="choixAjout('gallery')">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                Choisir une photo (Album)
            </button>
        </div>
    </div>

    <!-- INPUTS FICHIERS CACHÉS POUR APPAREIL PHOTO OU GALERIE -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="traiterPhotoDirecte(event)">
    <input type="file" id="galleryInput" accept="image/*" style="display:none;" onchange="traiterPhotoDirecte(event)">
    <input type="file" id="scanPhotoInput" accept="image/*" style="display:none;" onchange="traiterImportPhotoRecette(event)">

    <!-- 2. MODALE PLEIN ÉCRAN POUR IMPORTATION DE SITE WEB -->
    <div class="fullscreen-modal" id="siteImportModal">
        <div class="fullscreen-header">
            <h3>Importer depuis un site web</h3>
            <button class="close-fullscreen-btn" onclick="fermerModalSite()">&times;</button>
        </div>
        <div class="fullscreen-body">
            <div class="form-group">
                <label>Collez le lien (URL) de la recette</label>
                <input type="url" id="recipeUrlInput" placeholder="https://www.exemple.com/recette...">
            </div>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">
                L'application va analyser la page web pour récupérer automatiquement le titre, les ingrédients et les étapes.
            </p>
        </div>
        <div class="fullscreen-footer">
            <button class="primary-btn" style="background-color: var(--border-color); color: var(--text-main);" onclick="fermerModalSite()">Annuler</button>
            <button class="primary-btn" onclick="importerRecetteDepuisUrl()">Importer et remplir</button>
        </div>
    </div>

    <!-- 3. FORMULAIRE DE CRÉATION PLEIN ÉCRAN -->
    <div class="fullscreen-modal" id="recipeFormModal">
        <div class="fullscreen-header">
            <h3>Nouvelle Recette</h3>
            <button class="close-fullscreen-btn" onclick="fermerFormulaireAjout()">&times;</button>
        </div>

        <div class="form-tabs">
            <button class="form-tab-btn active" onclick="changerVoletForm(1)">1. Aperçu</button>
            <button class="form-tab-btn" onclick="changerVoletForm(2)">2. Ingrédients</button>
            <button class="form-tab-btn" onclick="changerVoletForm(3)">3. Préparation</button>
            <button class="form-tab-btn" onclick="changerVoletForm(4)">4. Notes</button>
            <button class="form-tab-btn" onclick="changerVoletForm(5)">5. Photos</button>
        </div>

        <div class="fullscreen-body">
            <!-- VOLET 1 -->
            <div class="form-volet active" id="volet-1">
                <div class="form-group">
                    <label>Titre de la recette</label>
                    <input type="text" id="recipeTitle" placeholder="Ex: Tarte aux pommes">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Destination</label>
                        <select id="recipeTargetSection" onchange="gererVisibiliteProfil(this.value)">
                            <option value="incontournables">Incontournables</option>
                            <option value="famille">Profil / Membre</option>
                        </select>
                    </div>
                    <div class="form-group" id="recipeProfilGroup" style="display: none;">
                        <label>Membre</label>
                        <select id="recipeProfilSelect">
                            <option value="Lucie">Lucie</option>
                            <option value="Clémence">Clémence</option>
                            <option value="Adeline">Adeline</option>
                            <option value="Gwenaëlle">Gwenaëlle</option>
                            <option value="Maman">Maman</option>
                            <option value="Malo">Malo</option>
                            <option value="Invité">Invité</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Catégorie</label>
                    <select id="recipeCategory">
                        <option value="apero">Apéro</option>
                        <option value="plats">Plats</option>
                        <option value="desserts">Desserts</option>
                        <option value="boulangerie">Boulangerie</option>
                        <option value="basiques">Basiques</option>
                        <option value="maison">Maison</option>
                        <option value="cosmetiques">Cosmétiques</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Portions</label>
                        <input type="number" id="recipePortions" value="4">
                    </div>
                    <div class="form-group">
                        <label>Prépa (m)</label>
                        <input type="number" id="recipePrepTime" value="15">
                    </div>
                    <div class="form-group">
                        <label>Cuisson (m)</label>
                        <input type="number" id="recipeCookTime" value="30">
                    </div>
                </div>
                <div class="form-group">
                    <label>Source</label>
                    <input type="text" id="recipeSource" placeholder="Ex: Livre, site...">
                </div>
            </div>

            <!-- VOLET 2 -->
            <div class="form-volet" id="volet-2">
                <label style="margin-bottom:6px; display:block; font-size:12px; color:var(--text-muted); font-weight:600;">Liste des ingrédients</label>
                <div id="ingredientsContainer">
                    <div class="ingredient-row">
                        <input type="text" placeholder="Qté" class="ing-qty">
                        <select class="ing-unit">
                            <option value="">(unité)</option>
                            <option value="g">g</option>
                            <option value="kg">kg</option>
                            <option value="ml">ml</option>
                            <option value="cl">cl</option>
                            <option value="L">L</option>
                            <option value="c.à.s">c. à s.</option>
                            <option value="c.à.c">c. à c.</option>
                            <option value="pincée">pincée</option>
                            <option value="pièce">pièce(s)</option>
                        </select>
                        <input type="text" placeholder="Ingrédient" class="ing-name">
                    </div>
                </div>
                <button type="button" class="secondary-btn" onclick="ajouterLigneIngredient()">+ Ajouter un ingrédient</button>
            </div>

            <!-- VOLET 3 -->
            <div class="form-volet" id="volet-3">
                <label style="margin-bottom:6px; display:block; font-size:12px; color:var(--text-muted); font-weight:600;">Étapes de préparation</label>
                <div id="etapesContainer">
                    <div class="etape-row">
                        <span class="etape-num">1</span>
                        <textarea placeholder="Décrivez l'étape..."></textarea>
                    </div>
                </div>
                <button type="button" class="secondary-btn" onclick="ajouterLigneEtape()">+ Ajouter une étape</button>
            </div>

            <!-- VOLET 4 -->
            <div class="form-volet" id="volet-4">
                <div class="form-group">
                    <label>Notes & Astuces</label>
                    <textarea id="recipeNotes" rows="6" placeholder="Conseils, conservation, variantes..."></textarea>
                </div>
            </div>

            <!-- VOLET 5 -->
            <div class="form-volet" id="volet-5">
                <div class="form-group">
                    <label>Photo de la recette (Fichier local)</label>
                    <input type="file" id="recipePhotoFile" accept="image/*" style="display:none;" onchange="chargerApercuPhoto(event)">
                    <button type="button" class="secondary-btn" onclick="document.getElementById('recipePhotoFile').click()">Choisir une image sur l'appareil</button>
                </div>
                
                <div class="form-group" style="margin-top: 10px;">
                    <label>Ou via un lien Web (URL)</label>
                    <input type="url" id="recipePhotoUrl" placeholder="https://exemple.com/image.jpg" oninput="chargerApercuUrl(this.value)">
                </div>

                <div class="form-group" style="text-align: center; margin-top: 10px;">
                    <label>Aperçu de la photo</label>
                    <div class="photo-preview" id="photoPreviewContainer">Aucune photo sélectionnée</div>
                </div>
            </div>
        </div>

        <div class="fullscreen-footer">
            <button class="primary-btn" style="background-color: var(--border-color); color: var(--text-main);" onclick="fermerFormulaireAjout()">Annuler</button>
            <button class="primary-btn" onclick="sauvegarderRecetteComprehensive()">Enregistrer</button>
        </div>
    </div>

    <!-- MODALE COULEURS PLEIN ÉCRAN -->
    <div class="fullscreen-modal" id="colorModal">
        <div class="fullscreen-header">
            <h3>Choisir une couleur</h3>
            <button class="close-fullscreen-btn" onclick="fermerModalCouleurs()">&times;</button>
        </div>
        <div class="fullscreen-body" style="display: flex; align-items: center; justify-content: center;">
            <div class="color-options" style="width: 100%; max-width: 300px;">
                <button class="color-circle" style="background-color: #1abc9c;" onclick="changerCouleur('turquoise')"></button>
                <button class="color-circle" style="background-color: #e67e22;" onclick="changerCouleur('orange')"></button>
                <button class="color-circle" style="background-color: #2ecc71;" onclick="changerCouleur('vert')"></button>
                <button class="color-circle" style="background-color: #9b59b6;" onclick="changerCouleur('mauve')"></button>
            </div>
        </div>
        <div class="fullscreen-footer">
            <button class="primary-btn" style="background-color: var(--border-color); color: var(--text-main);" onclick="fermerModalCouleurs()">Fermer</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item" onclick="retourAccueil()">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Accueil</span>
        </button>
        <button class="nav-item" id="themeToggleBtn" onclick="toggleTheme()">
            <svg id="themeIconSvg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <span>Mode</span>
        </button>
        <button class="nav-item" onclick="ouvrirModalCouleurs()">
            <svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5"></circle><circle cx="17.5" cy="10.5" r=".5"></circle><circle cx="8.5" cy="7.5" r=".5"></circle><circle cx="6.5" cy="12.5" r=".5"></circle><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.504 5.555-5.55C21.996 6.45 17.5 2 12 2z"></path></svg>
            <span>Couleurs</span>
        </button>
        <button class="nav-item" onclick="exporterRecettes()">
            <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
            <span>Exporter</span>
        </button>
    </nav>

    <script>
        const database = {
            incontournables: {
                apero: [
                    { nom: "Cake salé aux olives", img: "https://images.unsplash.com/photo-1541529086526-db283c563270" }
                ],
                plats: [
                    { nom: "Poulet rôti du dimanche", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c" }
                ],
                desserts: [
                    { nom: "Tarte aux pommes", img: "https://images.unsplash.com/photo-1551024709-8f23befc6f87" }
                ],
                boulangerie: [], basiques: [], maison: [], cosmetiques: []
            },
            famille: {
                Lucie: [{ nom: "Cookies moelleux", img: "https://images.unsplash.com/photo-1541529086526-db283c563270" }],
                Clémence: [], Adeline: [], Gwenaëlle: [], Maman: [], Malo: [], Invité: []
            }
        };

        const categoryMeta = {
            apero: { nom: "Apéro", img: "https://images.unsplash.com/photo-1541529086526-db283c563270" },
            plats: { nom: "Plats", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1" },
            desserts: { nom: "Desserts", img: "https://images.unsplash.com/photo-1551024709-8f23befc6f87" },
            boulangerie: { nom: "Boulangerie", img: "https://images.unsplash.com/photo-1509440159596-0249088772ff" },
            basiques: { nom: "Basiques", img: "https://images.unsplash.com/photo-1498837167922-ddd27525d352" },
            maison: { nom: "Maison", img: "https://images.unsplash.com/photo-1585421514284-efb74c2b69ba" },
            cosmetiques: { nom: "Cosmétiques", img: "https://images.unsplash.com/photo-1556228720-195a672e8a03" }
        };

        let imageRecetteActuelle = "";

        function renderCategories(onglet) {
            if (onglet === 'famille') {
                const profilEnregistre = localStorage.getItem('profilFamillePreere') || 'Lucie';
                document.getElementById('familleSelect').value = profilEnregistre;
                MettreAJourTexteBoutonProfil(profilEnregistre);
                filtrerFamille(profilEnregistre);
                return;
            }

            const container = document.getElementById(`categoriesGrid-${onglet}`);
            if (!container) return;
            container.innerHTML = '';
            container.style.display = 'grid';
            
            const listContainer = document.getElementById(`recipeList-${onglet}`);
            if (listContainer) listContainer.classList.remove('active');

            for (const [catKey, meta] of Object.entries(categoryMeta)) {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.onclick = () => ouvrirCategorie(onglet, catKey);
                card.innerHTML = `
                    <img src="${meta.img}" alt="${meta.nom}" class="category-img">
                    <div class="category-banner">
                        <span>${meta.nom}</span>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function ouvrirCategorie(onglet, catKey) {
            document.getElementById(`categoriesGrid-${onglet}`).style.display = 'none';
            const listContainer = document.getElementById(`recipeList-${onglet}`);
            listContainer.classList.add('active');
            listContainer.innerHTML = '';

            const backBtn = document.createElement('button');
            backBtn.className = 'back-cat-btn';
            backBtn.innerHTML = '← Retour aux catégories';
            backBtn.onclick = () => fermerCategorie(onglet);
            listContainer.appendChild(backBtn);

            const recipes = (database[onglet] && database[onglet][catKey]) || [];
            if (recipes.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.textAlign = 'center';
                emptyMsg.style.color = 'var(--text-muted)';
                emptyMsg.style.padding = '30px';
                emptyMsg.textContent = 'Aucune recette dans cette catégorie.';
                listContainer.appendChild(emptyMsg);
            } else {
                recipes.forEach(recipe => {
                    const row = document.createElement('div');
                    row.className = 'recipe-row-card';
                    row.onclick = () => alert("Affichage de : " + recipe.nom);
                    row.innerHTML = `
                        <img src="${recipe.img}" alt="${recipe.nom}" class="recipe-row-img">
                        <div class="recipe-row-banner">
                            <span>${recipe.nom}</span>
                        </div>
                    `;
                    listContainer.appendChild(row);
                });
            }
        }

        function fermerCategorie(onglet) {
            const listContainer = document.getElementById(`recipeList-${onglet}`);
            if (listContainer) listContainer.classList.remove('active');
            const grid = document.getElementById(`categoriesGrid-${onglet}`);
            if (grid) grid.style.display = 'grid';
        }

        function MettreAJourTexteBoutonProfil(personne) {
            const profilBtn = document.getElementById('profilTabBtn');
            if (profilBtn) profilBtn.textContent = `Profil : ${personne}`;
        }

        function changerFamilleSelection(personne) {
            localStorage.setItem('profilFamillePreere', personne);
            MettreAJourTexteBoutonProfil(personne);
            filtrerFamille(personne);
        }

        function filtrerFamille(personne) {
            const listContainer = document.getElementById('recipeList-famille');
            listContainer.innerHTML = '';
            const recipes = (database.famille && database.famille[personne]) || [];
            if (recipes.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.textAlign = 'center';
                emptyMsg.style.color = 'var(--text-muted)';
                emptyMsg.style.padding = '30px';
                emptyMsg.textContent = 'Aucune recette pour ce profil.';
                listContainer.appendChild(emptyMsg);
            } else {
                recipes.forEach(recipe => {
                    const row = document.createElement('div');
                    row.className = 'recipe-row-card';
                    row.onclick = () => alert("Affichage de : " + recipe.nom);
                    row.innerHTML = `
                        <img src="${recipe.img}" alt="${recipe.nom}" class="recipe-row-img">
                        <div class="recipe-row-banner">
                            <span>${recipe.nom}</span>
                        </div>
                    `;
                    listContainer.appendChild(row);
                });
            }
        }

        function changerOnglet(nomOnglet, elementBtn) {
            document.querySelectorAll('.view-section').forEach(section => section.classList.remove('active'));
            document.getElementById('view-' + nomOnglet).classList.add('active');
            document.querySelectorAll('.top-menu .menu-item').forEach(btn => btn.classList.remove('active'));
            if(elementBtn) elementBtn.classList.add('active');
            if (nomOnglet !== 'famille') fermerCategorie(nomOnglet);
            renderCategories(nomOnglet);
        }

        function retourAccueil() {
            changerOnglet('incontournables', document.querySelector('.top-menu .menu-item'));
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            const iconSvg = document.getElementById('themeIconSvg');
            if (isLight) {
                iconSvg.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
            } else {
                iconSvg.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
            }
        }

        function ouvrirModalCouleurs() { document.getElementById('colorModal').classList.add('active'); }
        function fermerModalCouleurs() { document.getElementById('colorModal').classList.remove('active'); }

        function changerCouleur(couleur) {
            document.body.classList.remove('theme-turquoise', 'theme-orange', 'theme-vert', 'theme-mauve');
            document.body.classList.add('theme-' + couleur);
            fermerModalCouleurs();
        }

        function toggleRecherche() {
            const sc = document.getElementById('searchContainer');
            sc.classList.toggle('active');
            if (sc.classList.contains('active')) document.getElementById('searchInput').focus();
        }

        function ouvrirMenuAjout() { document.getElementById('addChoiceModal').classList.add('active'); }
        function fermerMenuAjout() { document.getElementById('addChoiceModal').classList.remove('active'); }
        function fermerFormulaireAjout() { document.getElementById('recipeFormModal').classList.remove('active'); }
        function fermerModalSite() { document.getElementById('siteImportModal').classList.remove('active'); }

        function gererVisibiliteProfil(valeur) {
            document.getElementById('recipeProfilGroup').style.display = (valeur === 'famille') ? 'block' : 'none';
        }

        function changerVoletForm(num) {
            document.querySelectorAll('.form-volet').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.form-tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('volet-' + num).classList.add('active');
            document.querySelectorAll('.form-tab-btn')[num - 1].classList.add('active');
        }

        function choixAjout(type) {
            fermerMenuAjout();
            if (type === 'manuel') {
                document.getElementById('recipeFormModal').classList.add('active');
                changerVoletForm(1);
            } else if (type === 'site') {
                document.getElementById('siteImportModal').classList.add('active');
            } else if (type === 'scanPhoto') {
                document.getElementById('scanPhotoInput').click();
            } else if (type === 'camera') {
                document.getElementById('cameraInput').click();
            } else if (type === 'gallery') {
                document.getElementById('galleryInput').click();
            }
        }

        function traiterPhotoDirecte(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imageRecetteActuelle = e.target.result;
                    document.getElementById('recipeFormModal').classList.add('active');
                    changerVoletForm(5);
                    document.getElementById('photoPreviewContainer').innerHTML = `<img src="${imageRecetteActuelle}" style="width:100%; height:100%; object-fit:cover;">`;
                }
                reader.readAsDataURL(file);
            }
        }

        function traiterImportPhotoRecette(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imageRecetteActuelle = e.target.result;
                    document.getElementById('recipeFormModal').classList.add('active');
                    changerVoletForm(1);
                    document.getElementById('recipeTitle').value = "Recette importée par photo";
                    document.getElementById('recipeSource').value = "Photo de recette";
                    document.getElementById('photoPreviewContainer').innerHTML = `<img src="${imageRecetteActuelle}" style="width:100%; height:100%; object-fit:cover;">`;
                }
                reader.readAsDataURL(file);
            }
        }

        function importerRecetteDepuisUrl() {
            const url = document.getElementById('recipeUrlInput').value.trim();
            if (!url) { alert("Veuillez entrer un lien URL valide."); return; }
            fermerModalSite();
            document.getElementById('recipeTitle').value = "Recette importée du web";
            document.getElementById('recipeSource').value = url;
            document.getElementById('recipeFormModal').classList.add('active');
            changerVoletForm(1);
        }

        function ajouterLigneIngredient() {
            const container = document.getElementById('ingredientsContainer');
            const row = document.createElement('div');
            row.className = 'ingredient-row';
            row.innerHTML = `
                <input type="text" placeholder="Qté" class="ing-qty">
                <select class="ing-unit">
                    <option value="">(unité)</option>
                    <option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option>
                    <option value="cl">cl</option><option value="L">L</option><option value="c.à.s">c. à s.</option>
                    <option value="c.à.c">c. à c.</option><option value="pincée">pincée</option><option value="pièce">pièce(s)</option>
                </select>
                <input type="text" placeholder="Ingrédient" class="ing-name">
            `;
            container.appendChild(row);
        }

        function ajouterLigneEtape() {
            const container = document.getElementById('etapesContainer');
            const count = container.querySelectorAll('.etape-row').length + 1;
            const row = document.createElement('div');
            row.className = 'etape-row';
            row.innerHTML = `<span class="etape-num">${count}</span><textarea placeholder="Décrivez l'étape..."></textarea>`;
            container.appendChild(row);
        }

        function chargerApercuPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('recipePhotoUrl').value = "";
                const reader = new FileReader();
                reader.onload = function(e) {
                    imageRecetteActuelle = e.target.result;
                    document.getElementById('photoPreviewContainer').innerHTML = `<img src="${imageRecetteActuelle}" style="width:100%; height:100%; object-fit:cover;">`;
                }
                reader.readAsDataURL(file);
            }
        }

        function chargerApercuUrl(url) {
            document.getElementById('recipePhotoFile').value = "";
            const cleanUrl = url.trim();
            if (cleanUrl !== "") {
                imageRecetteActuelle = cleanUrl;
                document.getElementById('photoPreviewContainer').innerHTML = `<img src="${cleanUrl}" style="width:100%; height:100%; object-fit:cover;">`;
            } else {
                imageRecetteActuelle = "";
                document.getElementById('photoPreviewContainer').innerHTML = "Aucune photo sélectionnée";
            }
        }

        function sauvegarderRecetteComprehensive() {
            const titre = document.getElementById('recipeTitle').value;
            if (!titre.trim()) { alert("Veuillez renseigner au moins un titre."); changerVoletForm(1); return; }

            const cible = document.getElementById('recipeTargetSection').value;
            const categorie = document.getElementById('recipeCategory').value;
            const nouvelleRecette = {
                nom: titre,
                img: imageRecetteActuelle || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c"
            };

            if (cible === 'incontournables') {
                if (!database.incontournables[categorie]) database.incontournables[categorie] = [];
                database.incontournables[categorie].push(nouvelleRecette);
            } else {
                const membre = document.getElementById('recipeProfilSelect').value;
                if (!database.famille[membre]) database.famille[membre] = [];
                database.famille[membre].push(nouvelleRecette);
            }

            alert("Recette '" + titre + "' enregistrée !");
            fermerFormulaireAjout();
            imageRecetteActuelle = "";
            document.getElementById('photoPreviewContainer').innerHTML = "Aucune photo sélectionnée";
            
            const ongletActif = document.querySelector('.top-menu .menu-item.active');
            renderCategories(ongletActif && ongletActif.textContent.includes('Profil') ? 'famille' : 'incontournables');
        }

        function exporterRecettes() { alert("Fonction d'exportation déclenchée !"); }

        window.addEventListener('DOMContentLoaded', () => {
            const profilEnregistre = localStorage.getItem('profilFamillePreere') || 'Lucie';
            document.getElementById('familleSelect').value = profilEnregistre;
            MettreAJourTexteBoutonProfil(profilEnregistre);
            renderCategories('incontournables');
        });
    </script>
</body>
</html>
